[project]
name = "air-quality-platform"
version = "0.1.0"
description = "Air Quality Data Engineering Pipeline"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pandas",
    "sqlalchemy",
    "psycopg2-binary",
    "pyyaml",
    "requests",
    "psycopg[binary]>=3.3.9",
    "python-dotenv>=1.2.4",
]

[project.scripts]
air-quality-platform = "air_quality_platform.ingestion.air_quality_api:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
